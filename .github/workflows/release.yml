name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./alternatives/dotnet

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish and zip
      run: |
        mkdir -p ./release
        # <runtime identifier>:<asset name>
        for target in linux-x64:linux-x64 linux-arm64:linux-arm64 osx-arm64:osx-arm64 win-x64:windows-x64 win-arm64:windows-arm64; do
          rid="${target%%:*}"
          name="discogs-xml2db-${GITHUB_REF_NAME}-${target##*:}"
          dotnet publish discogs/discogs.csproj -c Release -r "$rid" -o "./artifacts/$name" \
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=None
          (cd ./artifacts && zip -r "../release/$name.zip" "$name")
        done
        ls -l ./release

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A release may already exist if the tag was created through the GitHub Releases UI
        if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        fi
        gh release upload "$GITHUB_REF_NAME" ./release/*.zip --clobber
